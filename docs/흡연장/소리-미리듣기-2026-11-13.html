<h1>흡연장 소리 미리듣기</h1>
<p class="s">갈색 = 예전 합성음(코드로 만든 소리), 초록 = 새 녹음 소리. 같은 크기로 나란히 눌러 비교하세요. 기기 음량을 먼저 확인해 주세요. 가상 흡연장 · 진짜 담배 없음 · 금연 응원.</p>

 sfx=ctx.createGain();sfx.gain.value=.9;sfx.connect(master);
 const n=ctx.sampleRate*2,b=ctx.createBuffer(1,n,ctx.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;noise=b;
 await Promise.all(Object.entries(B64).map(async([k,v])=>{const bin=atob(v),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
  try{bufs[k]=await ctx.decodeAudioData(u.buffer);}catch(e){msg('소리 파일을 풀지 못함: '+k);}}));
}
const now=()=>ctx.currentTime;
// ── 예전 합성음: src/lounge/audio.js의 SFX를 그대로 옮김
function noiseSrc(buf=noise,{rate=1,loop=true}={}){const s=ctx.createBufferSource();s.buffer=buf;s.loop=loop;s.playbackRate.value=rate;s.start(now(),Math.random()*1.5);return s;}
function filt(type,freq,q=1){const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=freq;f.Q.value=q;return f;}
function env(g,t0,a,peak,hold,release){g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(peak,t0+a);g.gain.setValueAtTime(peak,t0+a+hold);g.gain.exponentialRampToValueAtTime(.0001,t0+a+hold+release);return t0+a+hold+release;}
const stopAt=(nodes,t)=>{for(const n of nodes)try{n.stop(t+.05);}catch{}};
function hiss(dest,t0,{type='bandpass',freq=1200,q=1,to=null,a=.02,peak=.3,hold=0,release=.2,rate=1}={}){
 const s=noiseSrc(noise,{rate}),f=filt(type,freq,q),g=ctx.createGain();s.connect(f).connect(g).connect(dest);
 if(to)f.frequency.exponentialRampToValueAtTime(to,t0+a+hold+release);const end=env(g,t0,a,peak,hold,release);stopAt([s],end);return {f,g,end};}
function tone(dest,t0,{type='sine',freq=440,to=null,a=.005,peak=.2,hold=0,release=.1}={}){
 const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+a+hold+release);
 o.connect(g).connect(dest);o.start(t0);const end=env(g,t0,a,peak,hold,release);stopAt([o],end);return end;}
function crackle(dest,t0,dur,density=18,peak=.08){const n=Math.round(dur*density);for(let i=0;i<n;i++){const t=t0+Math.random()*dur;hiss(dest,t,{type:'highpass',freq:3500+Math.random()*3000,q:.7,a:.001,peak:peak*(.4+Math.random()*.6),release:.012+Math.random()*.015});}}
const EL={light:{hold:.3,release:.8},sweet:{hold:.8,release:1.7},deep:{hold:1.3,release:2.3}};
const SFX={
 flame(d,t){hiss(d,t,{type:'bandpass',freq:1000,q:.5,a:.012,peak:.3,hold:.02,release:.2});hiss(d,t+.04,{type:'lowpass',freq:520,q:.4,a:.06,peak:.09,hold:.3,release:.55});tone(d,t,{type:'sine',freq:110,to:70,peak:.07,a:.01,hold:.05,release:.3});},
 cap(d,t){for(const [f,pk,rel] of [[2900,.07,.12],[4100,.05,.09],[5400,.03,.06]])tone(d,t,{type:'sine',freq:f,peak:pk,a:.001,release:rel});hiss(d,t,{type:'highpass',freq:3500,q:.8,a:.001,peak:.12,release:.015});},
 wheel(d,t){hiss(d,t,{type:'bandpass',freq:2300,to:4200,q:1.2,a:.02,peak:.17,hold:.06,release:.1});for(let i=0;i<3;i++)hiss(d,t+.03+i*.04,{type:'bandpass',freq:3000+i*500,q:1.6,a:.001,peak:.1,release:.015});},
 lighter(d,t){SFX.cap(d,t);SFX.wheel(d,t+.14);SFX.flame(d,t+.32);},
 inhale(d,t){hiss(d,t,{type:'bandpass',freq:300,to:900,q:.9,a:.4,peak:.3,hold:.4,release:.28});hiss(d,t+.05,{type:'lowpass',freq:700,q:.4,a:.35,peak:.1,hold:.4,release:.25});crackle(d,t+.2,.7,10,.025);},
 exhale(d,t,q){const L=EL[q];hiss(d,t,{type:'bandpass',freq:1200,to:800,q:.7,a:.12,peak:.34,hold:L.hold,release:L.release});hiss(d,t,{type:'bandpass',freq:2000,to:1300,q:.9,a:.15,peak:.1,hold:L.hold*.8,release:L.release*.7});hiss(d,t,{type:'bandpass',freq:600,q:.8,a:.12,peak:.1,hold:L.hold*.9,release:L.release*.8});if(q!=='light')tone(d,t+.05,{type:'sine',freq:520,to:380,peak:.02,a:.12,hold:L.hold,release:L.release*.7});},
 can(d,t){tone(d,t,{type:'square',freq:1900,to:1300,peak:.06,a:.001,release:.025});hiss(d,t,{type:'highpass',freq:3500,q:.7,a:.001,peak:.4,release:.025});hiss(d,t+.06,{type:'highpass',freq:2600,to:5200,q:.6,a:.02,peak:.32,hold:.18,release:.3});crackle(d,t+.18,.7,26,.05);tone(d,t+.5,{type:'triangle',freq:700,to:560,peak:.02,release:.15});},
 burn(d,t){const s=noiseSrc(noise,{rate:1.3}),f=filt('bandpass',3000,.8),g=ctx.createGain();g.gain.value=.06;s.connect(f).connect(g).connect(d);stopAt([s],t+2);} // 예전 치이익(최대 크기로 2초)
};
// ── 새 녹음: fileCues와 같은 시작 시각·크기
function cues(list,d,t){for(const [n,dt,g] of list){const s=ctx.createBufferSource(),gn=ctx.createGain();s.buffer=bufs[n];gn.gain.value=g;s.connect(gn).connect(d);s.start(t+dt);}}
const NEW={
 lighter:d=>cues([['lighter-open.mp3',0,1],['lighter-strike.mp3',.2,1]],d,now()+.01),
 inhale:d=>cues([['inhale.mp3',0,.35]],d,now()+.01),
 'exhale-light':d=>cues([['exhale-short.mp3',0,.5]],d,now()+.01),
 'exhale-sweet':d=>cues([['exhale-mid.mp3',0,.5]],d,now()+.01),
 'exhale-deep':d=>cues([['exhale-long.mp3',0,.5]],d,now()+.01),
 can:d=>cues([['vending-button.mp3',0,.5],['can-drop.mp3',.3,.8],['can-open.mp3',1.2,.8]],d,now()+.01),
 burn:d=>{const s=ctx.createBufferSource(),g=ctx.createGain();s.buffer=bufs['cig-burn.flac'];s.loop=true;g.gain.value=.15;s.connect(g).connect(d);const t=now()+.01;s.start(t);s.stop(t+2);}
};
const OLD={lighter:(d,t)=>SFX.lighter(d,t),inhale:(d,t)=>SFX.inhale(d,t),'exhale-light':(d,t)=>SFX.exhale(d,t,'light'),'exhale-sweet':(d,t)=>SFX.exhale(d,t,'sweet'),'exhale-deep':(d,t)=>SFX.exhale(d,t,'deep'),can:(d,t)=>SFX.can(d,t),burn:(d,t)=>SFX.burn(d,t)};
async function go(kind,key,label){await init();const bus=ctx.createGain();bus.gain.value=1;bus.connect(sfx);
 if(kind==='old')OLD[key](bus,now()+.01);else NEW[key](bus);msg((kind==='old'?'예전 합성음: ':'새 녹음: ')+label);setTimeout(()=>bus.disconnect(),5000);}
const ITEMS=[
 ['lighter','라이터 켜기 (뚜껑 → 휠 → 불 붙기)','새 소리는 뚜껑 딸깍 → 0.2초 뒤 성냥 불 소리. 성냥 녹음이라 라이터와 다르게 들릴 수 있음'],
 ['burn','담배 타는 지직 (2초, 많이 들이마신 때)','새 소리는 0.74초짜리를 되풀이해서 반복 주기가 들릴 수 있음'],
 ['inhale','들이마시기','사람 한숨 녹음에서 자름'],
 ['exhale-light','내뿜기 · 가볍게 (0.8초)',''],
 ['exhale-sweet','내뿜기 · 보통 (1.7초)',''],
 ['exhale-deep','내뿜기 · 깊게 (2.3초)','한숨처럼 깊게 들릴 수 있음'],
 ['can','캔커피 뽑기 (버튼 삑 → 캔 덜컹 → 캔 따기)','예전에는 캔 따는 소리만 있었고 버튼·덜컹은 없었음']];
const list=document.getElementById('list');
for(const [k,t,n] of ITEMS){const c=document.createElement('div');c.className='card';c.innerHTML='<h2></h2><div class="row"><button class="old">예전 합성음</button><button class="new">새 소리</button></div>'+(n?'<div class="note"></div>':'');
 c.querySelector('h2').textContent=t;if(n)c.querySelector('.note').textContent=n;
 c.querySelector('.old').onclick=()=>go('old',k,t);c.querySelector('.new').onclick=()=>go('new',k,t);list.appendChild(c);}
</script></body></html>
