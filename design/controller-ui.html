<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>관악산 온라인 등반 — 조작·화면 배치 시안</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#f6f5e9;background:#e9ece4}
*{box-sizing:border-box}
body{margin:0;padding:20px 24px 60px;color:#173e36}
h1{font-size:20px;margin:0 0 4px}
.sub{font-size:13px;color:#51665b;margin:0 0 14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;position:sticky;top:0;background:#e9ece4;padding:8px 0;z-index:10}
.tabs button{font:inherit;font-size:13px;padding:8px 14px;border:1px solid #173e3640;border-radius:8px;background:#fff;color:#173e36;cursor:pointer;min-height:36px}
.tabs button.on{background:#173e36;color:#fff}
.tabs .sep{width:1px;background:#173e3640;margin:0 6px}
.group{margin:22px 0 8px;font-size:14px;font-weight:700;color:#173e36}
.row{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.cell{flex:none}
.cap{font-size:12px;color:#40564b;margin:0 0 6px}
.cap b{color:#173e36}
.scaler{position:relative;overflow:hidden;border-radius:calc(var(--rad,0px)*var(--s,1));box-shadow:0 6px 24px #0003;background:#000}
.dev{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;
  font-size:calc(12px*var(--u,1));container-type:size}

/* ---------- 장면(풍경 자리) ---------- */
.scene{position:absolute;inset:0;background:linear-gradient(#9cc6dc 0%,#cfe2dc 38%,#8fb08a 38.1%,#4f7a56 100%)}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.path{position:absolute;left:50%;bottom:0;width:34%;height:46%;transform:translateX(-50%);
  background:linear-gradient(#b8a584,#8e7b5c);clip-path:polygon(42% 0,58% 0,100% 100%,0 100%);opacity:.85}
.hero{position:absolute;left:50%;bottom:19%;width:9%;min-width:34px;transform:translateX(-50%)}
.hero svg{position:static;width:100%;height:auto}
.cam-ring{position:absolute;left:50%;bottom:17%;width:20%;aspect-ratio:3/1;transform:translateX(-50%);border:1.5px dashed #fffb;border-radius:50%}
.tip{position:absolute;left:50%;transform:translateX(-50%);padding:6px 12px;border-radius:99px;font-size:calc(11px*var(--u,1));color:#fff;white-space:nowrap}
.p .tip{top:calc(var(--st) + 82px*var(--u,1));left:calc(var(--sl) + 12px);transform:none}
.l .tip{top:calc(var(--st) + 10px);left:calc(50% + 40px)}
.pc .tip{top:62px}
.cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border:1.5px solid #fff9;border-radius:50%}

/* ---------- 공통 HUD 부품 ---------- */
.hud{position:absolute;inset:0;pointer-events:none}
.glass{background:#173e36b8;backdrop-filter:blur(6px);border:1px solid #ffffff22}
.ctl{transition:opacity .4s}
.idle .ctl{opacity:.35}                 /* 쓰지 않을 때 흐리게 */
.btn{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:calc(52px*var(--u,1));height:calc(52px*var(--u,1));min-width:44px;min-height:44px;border-radius:14px;
  font-size:calc(10px*var(--u,1));line-height:1}
.btn i{font-style:normal;font-size:calc(18px*var(--u,1));line-height:1}
.btn.on{background:#e4d6aa;color:#254034;border-color:#e4d6aa}
.btn kbd{font:calc(9px*var(--u,1)) ui-monospace,monospace;opacity:.8}
.joy{position:absolute;border-radius:50%;width:calc(128px*var(--u,1));height:calc(128px*var(--u,1))}
.joy::before{content:"";position:absolute;inset:calc(40px*var(--u,1));border-radius:50%;background:#f0edce99;border:1px solid #fff9}
.joy em{position:absolute;font-style:normal;font-size:calc(9px*var(--u,1));opacity:.8;left:50%;transform:translateX(-50%)}
.joy .f{top:5px}.joy .b{bottom:5px}
.look{position:absolute;border:1.5px dashed #ffffff90;border-radius:16px;display:grid;place-items:center;
  font-size:calc(11px*var(--u,1));color:#fff;text-shadow:0 1px 4px #0008;background:#ffffff0d}
.guide-off .look{border-color:transparent;background:none;color:transparent}

.prog{position:absolute;color:#f6f5e9}
.prog .bar{height:3px;background:#ffffff30;border-radius:2px;overflow:hidden}
.prog .bar i{display:block;height:100%;width:39%;background:#dbbf7d}
.prog b{font-weight:600;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;background:#e4d6aa;color:#254034;font-weight:700;white-space:nowrap}
.pill.off{background:#ffffff1f;color:#dfe5d8;font-weight:400}
.dim{opacity:.72}

/* 세로 얇은 띠 */
.strip{padding:6px 12px 7px;border-radius:12px;display:flex;flex-direction:column;gap:5px}
.strip .r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:calc(12px*var(--u,1))}
.strip .r2{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:calc(11px*var(--u,1));white-space:nowrap}
/* 카드(가로·PC) */
.card{padding:10px 14px 12px;border-radius:14px}
.card .hd{display:flex;justify-content:space-between;align-items:center;font-size:calc(11px*var(--u,1));margin-bottom:6px}
.card .big{font-size:calc(18px*var(--u,1));font-weight:600;margin:2px 0 7px;font-variant-numeric:tabular-nums}
.card .big small{font-size:.6em;font-weight:400;opacity:.75}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;margin-top:8px;font-size:calc(11px*var(--u,1))}
.card .grid span{display:block;opacity:.7;font-size:.9em}
.card .grid b{font-size:1.25em;font-weight:500}
.top-icons{position:absolute;display:flex;gap:8px}
.ico{display:grid;place-items:center;width:44px;height:44px;border-radius:12px;font-size:calc(16px*var(--u,1))}
.hint{position:absolute;padding:6px 12px;border-radius:99px;font-size:calc(11px*var(--u,1));white-space:nowrap}
.keys{position:absolute;display:flex;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;font-size:calc(11px*var(--u,1))}
kbd.k{display:inline-block;min-width:22px;text-align:center;font:600 calc(11px*var(--u,1)) ui-monospace,monospace;padding:3px 6px;border:1px solid #fff6;border-bottom-width:2px;border-radius:5px;background:#ffffff14}

/* ---------- 레이아웃: 모바일·태블릿 세로 ---------- */
.p .strip{position:absolute;top:calc(var(--st) + 8px);left:calc(var(--sl) + 12px);right:calc(var(--sr) + 12px)}
.p .top-icons{top:calc(var(--st) + 8px + 66px*var(--u,1));right:calc(var(--sr) + 12px)}
.p .joy{left:calc(var(--sl) + 18px);bottom:calc(var(--sb) + 22px)}
.p .btns .btn{right:calc(var(--sr) + 14px)}
.p .btns .b5{bottom:calc(var(--sb) + 22px + 4*(62px*var(--u,1)))}
.p .btns .b1{bottom:calc(var(--sb) + 22px + 3*(62px*var(--u,1)))}
.p .btns .b2{bottom:calc(var(--sb) + 22px + 2*(62px*var(--u,1)))}
.p .btns .b3{bottom:calc(var(--sb) + 22px + 1*(62px*var(--u,1)))}
.p .btns .b4{bottom:calc(var(--sb) + 22px)}
.p .look{left:44%;right:calc(var(--sr) + 80px*var(--u,1));top:calc(var(--st) + 130px*var(--u,1));bottom:calc(var(--sb) + 40px)}
/* 세로 모양 둘러보기 영역은 오른쪽 버튼 열 왼쪽 */
.p .look{left:42%;right:calc(var(--sr) + 14px + 52px*var(--u,1) + 12px)}

/* ---------- 모바일 가로 ---------- */
.l .strip{position:absolute;top:8px;left:calc(var(--sl) + 8px);width:min(300px,38%);}
.l .top-icons{top:8px;right:calc(var(--sr) + 8px)}
.l .joy{left:calc(var(--sl) + 14px);bottom:calc(var(--sb) + 12px);width:100px;height:100px}
.l .joy::before{inset:31px}
.l .btns .btn{bottom:calc(var(--sb) + 12px)}
.l .btns .b5{right:calc(var(--sr) + 8px + 4*60px)}
.l .btns .b1{right:calc(var(--sr) + 8px + 3*60px)}
.l .btns .b2{right:calc(var(--sr) + 8px + 2*60px)}
.l .btns .b3{right:calc(var(--sr) + 8px + 1*60px)}
.l .btns .b4{right:calc(var(--sr) + 8px)}
.l .look{left:46%;right:calc(var(--sr) + 8px);top:60px;bottom:calc(var(--sb) + 12px + 52px + 10px)}
/* 태블릿 가로·PC 는 카드형(.card)을 쓴다 */
.t.l .strip{display:none}

/* ---------- 태블릿 가로 (터치 + 카드) ---------- */
.tl .prog.card{position:absolute;top:calc(var(--st) + 12px);left:calc(var(--sl) + 16px);width:300px}
.tl .top-icons{top:calc(var(--st) + 12px);right:calc(var(--sr) + 16px)}
.tl .joy{left:calc(var(--sl) + 28px);bottom:calc(var(--sb) + 28px)}
.tl .btns .btn{bottom:calc(var(--sb) + 28px)}
.tl .btns .b5{right:calc(var(--sr) + 28px + 4*70px)}
.tl .btns .b1{right:calc(var(--sr) + 28px + 3*70px)}
.tl .btns .b2{right:calc(var(--sr) + 28px + 2*70px)}
.tl .btns .b3{right:calc(var(--sr) + 28px + 1*70px)}
.tl .btns .b4{right:calc(var(--sr) + 28px)}
.tl .look{left:42%;right:calc(var(--sr) + 28px);top:90px;bottom:calc(var(--sb) + 28px + 70px)}

/* ---------- PC ---------- */
.pc{--u:1}
.pc .prog.card{position:absolute;top:24px;left:28px;width:320px}
.pc .top-icons{top:24px;right:28px}
.pc .keys{left:28px;bottom:24px}
.pc .btns .btn{bottom:24px;width:64px;height:58px;font-size:12px}
.pc .btns .b5{right:calc(28px + 4*72px)}
.pc .btns .b1{right:calc(28px + 3*72px)}
.pc .btns .b2{right:calc(28px + 2*72px)}
.pc .btns .b3{right:calc(28px + 72px)}
.pc .btns .b4{right:28px}
.pc .hint.lock{left:50%;top:22px;transform:translateX(-50%)}
.pc1366{font-size:12px}

/* ---------- 레이어(이어하기·체크포인트·인증) ---------- */
.scrim{position:absolute;inset:0;background:#0f2a2477;backdrop-filter:blur(3px);pointer-events:auto}
.layer{position:absolute;color:#183e32;background:#faf8ee;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 12px 50px #0006;font-size:calc(13px*var(--u,1))}
.layer h2{font-size:calc(19px*var(--u,1));margin:0;font-weight:650;letter-spacing:-.3px}
.layer p{margin:0;line-height:1.55;font-size:calc(12.5px*var(--u,1))}
.layer .eyebrow{font-size:calc(10.5px*var(--u,1));letter-spacing:.6px;color:#8a6d2f;font-weight:700;margin-bottom:3px}
.layer .photo{position:relative;flex:1 1 0;min-height:0;background:linear-gradient(#a8cfe0,#d6e5dc 55%,#7ea077 55.1%,#4f7a56);overflow:hidden}
.layer .photo svg{position:absolute;inset:0;width:100%;height:100%}
.layer .photo .ph{position:absolute;left:8px;bottom:6px;font-size:10px;color:#fff;text-shadow:0 1px 3px #0009}
.layer .body{padding:14px 18px 6px;flex:none}
.layer .credit{font-size:10px;color:#6c7d73;margin-top:6px}
.layer .acts{display:flex;gap:8px;padding:10px 18px calc(14px + var(--sb2,0px));flex:none}
.layer .acts button{flex:1;min-height:46px;border-radius:12px;border:0;font:inherit;font-weight:600;background:#245541;color:#fff;font-size:calc(13px*var(--u,1))}
.layer .acts button.sub{background:#e8eadf;color:#245541}
.stats{display:grid;gap:8px;padding:12px 18px 2px}
.stats div{background:#eef0e4;border-radius:10px;padding:9px 11px}
.stats span{display:block;font-size:calc(10.5px*var(--u,1));color:#5f7367}
.stats b{display:block;font-size:calc(18px*var(--u,1));font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.stats b small{font-size:.62em;font-weight:500;color:#5f7367}
.cert-head{padding:14px 18px 0;text-align:center}
.cert-head .mt{font-size:calc(11px*var(--u,1));color:#8a6d2f;font-weight:700;letter-spacing:1px}
.cert-head h2{font-size:calc(26px*var(--u,1));margin:2px 0}
.cert-head .alt{font-size:calc(12px*var(--u,1));color:#5f7367}
.cert-flag{margin:10px 18px 0;height:calc(70px*var(--u,1));flex:1 1 0;min-height:0;max-height:calc(120px*var(--u,1));border-radius:12px;background:linear-gradient(#a8cfe0,#d6e5dc 60%,#7ea077 60.1%);position:relative;overflow:hidden}
.cert-flag svg{position:absolute;inset:0;width:100%;height:100%}
.thin{height:4px;background:#d6dccc;border-radius:3px;margin:8px 0 2px}.thin i{display:block;height:100%;background:#c5a35a;border-radius:3px}

/* 세로: 아래에서 올라오는 시트 */
.p .layer{left:0;right:0;bottom:0;border-radius:22px 22px 0 0;max-height:calc(100% - var(--st) - 24px);--sb2:var(--sb)}
.p .layer.cp{height:calc(100% - var(--st) - 24px)}
.p .layer.cp .photo{flex:0 1 40%}
.p .layer.sheet-sm{height:auto}
.p .stats{grid-template-columns:1fr 1fr}
.p .layer.cert{height:calc(100% - var(--st) - 24px)}
/* 가로·PC: 가운데 카드, 좌우 2열 */
.l .layer,.pc .layer{left:50%;top:50%;transform:translate(-50%,-50%);border-radius:20px;
  width:min(calc(100% - var(--sl) - var(--sr) - 40px),calc(760px*var(--u,1)));
  max-height:calc(100% - var(--st) - var(--sb) - 24px)}
.l .layer.cp,.l .layer.cert,.pc .layer.cp,.pc .layer.cert{height:calc(100% - var(--st) - var(--sb) - 24px);max-height:calc(560px*var(--u,1));display:grid;grid-template-columns:44% 1fr;grid-template-rows:1fr auto}
.l .layer.cp .photo,.pc .layer.cp .photo{grid-row:1/3;flex:none}
.l .layer.cp .body,.pc .layer.cp .body{align-self:end;padding-top:16px}
.l .layer.cert{grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto}
.l .layer.cert .cert-head{grid-column:1/3}
.l .layer.cert .stats{grid-column:1/3;grid-template-columns:repeat(4,1fr)}
.l .layer.cert .cert-flag{display:none}
.l .layer.cert .acts{grid-column:1/3}
.pc .layer.cert{grid-template-columns:1fr;grid-template-rows:auto 1fr auto auto}
.pc .layer.cert .stats{grid-template-columns:repeat(4,1fr)}
.l .layer.res,.pc .layer.res{width:min(calc(100% - var(--sl) - var(--sr) - 40px),calc(460px*var(--u,1)))}
.tp .layer.res,.p .layer.res{}
.tp .layer{--u:1.2}
.l .stats{padding-top:8px}
.l .layer h2{font-size:17px}

/* 안내 오버레이 */
.guide{position:absolute;color:#f6f5e9;pointer-events:auto}
.callout{position:absolute;padding:6px 10px;border-radius:10px;background:#e4d6aa;color:#254034;font-weight:700;font-size:calc(11px*var(--u,1));white-space:nowrap}
.callout::after{content:"";position:absolute;width:2px;background:#e4d6aa}
.kg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(calc(100% - var(--sl) - var(--sr) - 40px),calc(720px*var(--u,1)));max-height:calc(100% - var(--st) - var(--sb) - 24px);overflow:hidden;
  padding:calc(18px*var(--u,1)) calc(22px*var(--u,1));border-radius:20px;background:#173e36ee;color:#f6f5e9;border:1px solid #ffffff2a}
.kg h2{margin:0 0 12px;font-size:calc(18px*var(--u,1))}
.kg table{width:100%;border-collapse:collapse;font-size:calc(12.5px*var(--u,1))}
.kg td{padding:calc(5px*var(--u,1)) 4px;border-bottom:1px solid #ffffff1c}
.kg td:first-child{white-space:nowrap}
.kg .foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:calc(11px*var(--u,1));opacity:.85}
.kg .go{background:#e4d6aa;color:#254034;font-weight:700;border-radius:10px;padding:10px 18px;min-height:44px;display:inline-flex;align-items:center}
/* 보정: 내용만큼만 높이, 사진은 고정 비율 */
.p .layer.cp,.p .layer.cert{height:auto}
.p .layer.cp .photo{flex:none;height:calc(230px*var(--u,1))}
.p .layer.cert .cert-flag,.pc .layer.cert .cert-flag{flex:none;height:calc(110px*var(--u,1))}
.l .layer.cert,.pc .layer.cert{height:auto;grid-template-rows:auto auto auto}
.pc .layer.cert{grid-template-rows:auto auto auto auto}
.l .layer.cp .body,.pc .layer.cp .body{align-self:start}
.l .layer.cp .acts,.pc .layer.cp .acts{align-self:end}
.note{font-size:12px;color:#40564b;margin:6px 0 0;max-width:900px;line-height:1.6}
</style>
</head>
<body>
<h1>조작·화면 배치 시안 (기획서 0-1·0-2장)</h1>
<p class="sub">실제 화면 크기(px)를 그대로 줄여 보여 줍니다. 점선 영역 = 둘러보기 드래그 영역, 짙은 칸 = 터치 영역(최소 44×44pt). 노치·홈 바는 safe-area 값으로 모의했습니다(빗금 없음, 값은 캡션에 표기).</p>
<div class="tabs" id="tabs"></div>
<div id="stage"></div>

<script>
const DEVICES=[
 {id:'p390',g:'모바일 세로',name:'390×844',w:390,h:844,k:'p',s:.62,st:47,sb:34,sl:0,sr:0,rad:36,u:1},
 {id:'p360',g:'모바일 세로',name:'360×800',w:360,h:800,k:'p',s:.62,st:24,sb:16,sl:0,sr:0,rad:20,u:1},
 {id:'l844',g:'모바일 가로',name:'844×390',w:844,h:390,k:'l',s:.8,st:0,sb:21,sl:47,sr:47,rad:30,u:1},
 {id:'tp',g:'태블릿',name:'세로 820×1180',w:820,h:1180,k:'p t tp',s:.42,st:24,sb:20,sl:0,sr:0,rad:20,u:1.25},
 {id:'tl',g:'태블릿',name:'가로 1180×820',w:1180,h:820,k:'l t tl',s:.5,st:24,sb:20,sl:0,sr:0,rad:20,u:1.15},
 {id:'pc1366',g:'PC',name:'1366×768',w:1366,h:768,k:'pc pc1366',s:.5,st:0,sb:0,sl:0,sr:0,rad:6,u:1},
 {id:'pc1920',g:'PC',name:'1920×1080',w:1920,h:1080,k:'pc',s:.36,st:0,sb:0,sl:0,sr:0,rad:6,u:1.12},
];
const SCREENS=[
 ['play','걷는 중'],['idle','쉬는 중(컨트롤 흐림)'],['guide','첫 안내'],['resume','이어하기'],['third','3인칭으로 걷는 중'],['cp','체크포인트'],['cert','정상 인증']
];
const ridge=`<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polygon points="0,40 12,30 24,38 38,22 52,36 66,26 82,38 100,30 100,60 0,60" fill="#6f957e" opacity=".75"/><polygon points="0,48 18,40 34,46 55,34 78,46 100,40 100,100 0,100" fill="#5d8a62" opacity=".9"/></svg>`;
const hero=`<div class="cam-ring"></div><div class="hero"><svg viewBox="0 0 40 100"><circle cx="20" cy="10" r="8" fill="#e8c9a5"/><rect x="9" y="19" width="22" height="38" rx="8" fill="#cb733d"/><rect x="10" y="55" width="8" height="38" rx="3" fill="#3d4a56"/><rect x="22" y="55" width="8" height="38" rx="3" fill="#3d4a56"/><rect x="7" y="16" width="26" height="10" rx="5" fill="#6b4a2b" opacity=".9"/></svg></div>`;
const flag=`<svg viewBox="0 0 100 60" preserveAspectRatio="none"><polygon points="0,38 20,28 40,36 62,18 84,32 100,26 100,60 0,60" fill="#6f957e"/><rect x="72" y="8" width="1.2" height="16" fill="#fff"/><polygon points="73.2,8 84,11 73.2,14" fill="#cb733d"/></svg>`;

function hud(d,third){
  const l=d.k.startsWith('l'),pc=d.k.startsWith('pc');
  const strip=`<div class="prog strip glass ctl-keep"><div class="r1"><span>걸은 <b>1.84</b> / 남은 <b>2.86</b> km <span class="dim">(3D)</span></span><span class="pill">▶ 자동 걷기</span></div>
   <div class="bar"><i></i></div>
   <div class="r2"><span>고도 <b>412</b>m <span class="dim">누적 ↑<b>310</b></span></span><span>걸은 <b>0:58:40</b></span><span>남은 약 <b>1:31</b></span></div></div>`;
  const card=`<div class="prog card glass"><div class="hd"><span class="dim">정상 접근 · 연주대 629m</span><span class="pill">▶ 자동 걷기 켜짐</span></div>
   <div class="big">1.84 km <small>/ 4.70 km (3D)</small></div><div class="bar"><i></i></div>
   <div class="grid"><div><span>남은 거리</span><b>2.86 km</b></div><div><span>현재 고도</span><b>412 m</b></div><div><span>걸은 시간</span><b>0:58:40</b></div><div><span>누적 상승</span><b>+310 m</b></div><div style="grid-column:1/3"><span>남은 예상 시간</span><b>약 1시간 31분</b></div></div></div>`;
  const top=`<div class="top-icons ctl"><div class="ico glass" title="키 안내/도움말">?</div><div class="ico glass">♪</div></div>`;
  if(pc){
    return `${card}${top}${third?'<div class="tip glass">카메라를 돌려 보세요 · 걷는 방향은 그대로</div>':''}
    <div class="keys glass ctl"><span><kbd class="k">W</kbd><kbd class="k">A</kbd><kbd class="k">S</kbd><kbd class="k">D</kbd> 걷기·비켜가기</span><span><kbd class="k">Q</kbd><kbd class="k">E</kbd> 몸 돌리기</span><span><kbd class="k">F</kbd> 정면 보기</span><span><kbd class="k">?</kbd> 키 안내</span></div>
    <div class="hint lock glass">${third?'마우스 끌기: 카메라 회전 · 휠: 확대 · <kbd class="k">F</kbd> 정면 보기':'화면을 클릭하면 마우스로 둘러보기 · <kbd class="k">Esc</kbd> 해제'}</div>
    <div class="btns ctl">
     <div class="btn glass b1 on"><i>⇢</i>자동 <kbd>R</kbd></div><div class="btn glass b2"><i>❚❚</i>정지 <kbd>Space</kbd></div>
     <div class="btn glass b3 ${third?'on':''}"><i>◉</i>시점 <kbd>V</kbd></div><div class="btn glass b4"><i>⌖</i>지도 <kbd>M</kbd></div><div class="btn glass b5"><i>◐</i>정면 <kbd>F</kbd></div></div>`;
  }
  const joy=`<div class="joy glass ctl"><em class="f">앞</em><em class="b">뒤</em></div>`;
  const btns=`<div class="btns ctl"><div class="btn glass b1 on"><i>⇢</i>자동</div><div class="btn glass b2"><i>❚❚</i>정지</div><div class="btn glass b3 ${third?'on':''}"><i>◉</i>시점</div><div class="btn glass b4"><i>⌖</i>지도</div><div class="btn glass b5"><i>◐</i>정면</div></div>`;
  const look=`<div class="look ctl">${third?'끌어서 카메라 돌리기 · 두 손가락 확대':'걸으면서 끌어 둘러보기'}</div>`;
  const prog=(d.k.includes('tl'))?card:strip;
  const tip=third?`<div class="tip glass">카메라를 돌려 보세요 · 걷는 방향은 그대로</div>`:'';
  return `${prog}${top}${tip}${look}${joy}${btns}`;
}

function guideLayer(d){
  const pc=d.k.startsWith('pc');
  if(pc) return `<div class="scrim"></div><div class="kg"><h2>처음 한 번만 보여 드려요 — 키 안내</h2>
   <table>
   <tr><td><kbd class="k">W</kbd> <kbd class="k">↑</kbd> / <kbd class="k">S</kbd> <kbd class="k">↓</kbd></td><td>앞으로 걷기 / 뒤로</td></tr>
   <tr><td><kbd class="k">A</kbd> <kbd class="k">←</kbd> / <kbd class="k">D</kbd> <kbd class="k">→</kbd></td><td>등산로 안에서 비켜 가기</td></tr>
   <tr><td>걸으면서 마우스 · <kbd class="k">Q</kbd> <kbd class="k">E</kbd></td><td>둘러보며 걷기(걷는 방향은 그대로) · 몸 돌리기 (클릭하면 포인터 잠금, <kbd class="k">Esc</kbd>로 해제)</td></tr>
   <tr><td><kbd class="k">R</kbd></td><td>자동 걷기 켜기·끄기</td></tr>
   <tr><td><kbd class="k">Space</kbd> · <kbd class="k">V</kbd> · <kbd class="k">M</kbd></td><td>일시정지 · 1인칭/3인칭 · 지도</td></tr>
   <tr><td><kbd class="k">F</kbd></td><td>정면 보기: 카메라를 걷는 방향 뒤로 되돌리기</td></tr></table>
   <div class="foot"><span>속도는 어떤 키를 써도 실제 걷는 속도로 고정됩니다. 화면 위 <b>?</b> 버튼이나 <kbd class="k">H</kbd> 키로 다시 볼 수 있어요.</span><span class="go">시작하기</span></div></div>`;
  const small=d.k.startsWith('l')&&!d.k.includes('tl');
  return `<div class="scrim"></div>
   <div class="callout" style="left:calc(var(--sl) + 12px);bottom:calc(var(--sb) + ${small?122:178}px*var(--u,1))">조이스틱: 밀면 걷기 · 살짝만 밀어도 같은 속도</div>
   <div class="callout" style="left:${small?'44%':'30%'};top:30%">걸으며 드래그: 시선만 돌아가요</div>
   <div class="callout" style="right:calc(var(--sr) + ${small?72:84}px*var(--u,1));bottom:calc(var(--sb) + ${small?72:34}px*var(--u,1))">자동·정지·시점·지도·정면</div>
   <div class="callout" style="left:50%;top:50%;transform:translate(-50%,-50%);background:#faf8ee">처음 한 번만 보여요 · 탭하면 닫기<br><span style="font-weight:400">?(도움말)에서 다시 볼 수 있어요</span></div>`;
}

function layer(d,type){
  const pc=d.k.startsWith('pc'), l=d.k.startsWith('l');
  const photo=`<div class="photo">${ridge}<span class="ph">사진 자리 · 출처: 공공누리 제_유형(확인 필요)</span></div>`;
  if(type==='resume') return `<div class="scrim"></div><div class="layer res sheet-sm">
    <div class="body" style="padding-top:18px"><div class="eyebrow">이어하기</div><h2>지난번 그 자리에서 이어 걸어요</h2>
    <p style="margin-top:6px" class="dim">연주샘 아래 · 2일 전 저장 · 체크포인트 3/5 통과(제1광장·아카시아동산·제4쉼터)</p>
    <div class="thin"><i style="width:39%"></i></div></div>
    <div class="stats" style="grid-template-columns:1fr 1fr 1fr"><div><span>걸은 거리</span><b>1.84<small> km</small></b></div><div><span>걸은 시간</span><b>0:58<small> 쉬는 시간 제외</small></b></div><div><span>현재 고도</span><b>412<small> m</small></b></div></div>
    <div class="acts"><button>이어서 걷기</button><button class="sub">처음부터</button></div></div>`;
  if(type==='cp') return `<div class="scrim"></div><div class="layer cp">${photo}
    <div class="body"><div class="eyebrow">체크포인트 4 / 5 · 고도 412m(예시)</div><h2>연주샘</h2>
    <p style="margin-top:6px">시범 문구: 제4쉼터를 지나 돌길·계단이 이어지는 구간의 다음 지점입니다. 여기서 정상까지 남은 거리와 시간을 확인하고 잠시 숨을 고릅니다. (설명 최대 3줄, 넘치면 안에서 줄임)</p>
    <p class="credit">사진: 관악구청 (공공누리 제1유형 · 출처표시) — 자료 확보 후 교체</p></div>
    <div class="acts"><button class="sub">자세히</button><button>계속 걷기</button></div></div>`;
  return `<div class="scrim"></div><div class="layer cert">
    <div class="cert-head"><div class="mt">정상 인증 · 서울대 입구 → 연주대</div><h2>연주대 629m</h2><div class="alt">2026.11.02 · 온라인 완등</div></div>
    <div class="cert-flag">${flag}</div>
    <div class="stats"><div><span>총 3D 거리</span><b>4.70<small> km</small></b></div><div><span>걸은 시간(쉰 시간 제외)</span><b>2:28:30</b></div><div><span>누적 상승</span><b>+612<small> m</small></b></div><div><span>나눠 오른 횟수</span><b>3<small> 번</small></b></div></div>
    <div class="acts"><button class="sub">이미지 저장</button><button>다시 보기</button></div></div>`;
}

function render(screen){
  const stage=document.getElementById('stage');stage.innerHTML='';
  let lastG='';let row;
  let devs=DEVICES;
  devs.forEach(d=>{
    if(d.g!==lastG){lastG=d.g;const h=document.createElement('div');h.className='group';h.textContent=d.g;stage.appendChild(h);row=document.createElement('div');row.className='row';stage.appendChild(row);}
    const s=d.s;
    const cell=document.createElement('div');cell.className='cell';
    const idle=screen==='idle';
    let inner=`<div class="scene">${ridge}<div class="path"></div><div class="cross"></div></div>`;
    if(screen==='third')inner=inner.replace('<div class="cross">',hero+'<div class="cross" style="display:none">');
    inner+=`<div class="hud ${idle?'idle':''}">${hud(d,screen==='third')}</div>`;
    if(screen==='guide')inner+=guideLayer(d);
    else if(['resume','cp','cert'].includes(screen))inner+=layer(d,screen);
    cell.innerHTML=`<p class="cap"><b>${d.name}</b> · safe-area 위${d.st} 아래${d.sb}${d.sl?' 좌우'+d.sl:''}</p>
     <div class="scaler" style="width:${d.w*s}px;height:${d.h*s}px;--rad:${d.rad}px;--s:${s}">
     <div class="dev ${d.k}" style="width:${d.w}px;height:${d.h}px;transform:scale(${s});--u:${d.u};--st:${d.st}px;--sb:${d.sb}px;--sl:${d.sl}px;--sr:${d.sr}px">${inner}</div></div>`;
    row.appendChild(cell);
  });
}
const tabs=document.getElementById('tabs');
SCREENS.forEach(([id,label],i)=>{const b=document.createElement('button');b.textContent=label;b.dataset.id=id;b.onclick=()=>{go(id)};tabs.appendChild(b)});
function go(id){[...tabs.children].forEach(b=>b.classList.toggle('on',b.dataset.id===id));render(id);history.replaceState(null,'','#'+id)}
go(location.hash.slice(1)||'play');
</script>
</body>
</html>
