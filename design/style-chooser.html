<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>그래픽 모드 선택 시안</title>
<style id="style-chooser-style">
#style-chooser{position:fixed;inset:0;z-index:110;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;background:linear-gradient(180deg,#0d2a25 0%,#173f36 45%,#2d5a45 100%);color:#f4f1e8;font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#style-chooser[hidden]{display:none}
#style-chooser::before{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 40% at 72% 18%,#f0d9a233,transparent 70%)}
#style-chooser .sc-head{position:relative;text-align:center}
#style-chooser .sc-brand{margin:0 0 6px;font-size:13px;letter-spacing:2px;color:#cdd9c4}
#style-chooser .sc-brand b{font-size:22px;color:#f4f1e8;margin-right:8px}
#style-chooser h1{margin:0;font-size:clamp(20px,4.6vw,28px);line-height:1.3;font-weight:700;letter-spacing:-.01em}
#style-chooser .sc-sub{margin:8px 0 0;font-size:14px;color:#dfe8d6}
#style-chooser .sc-cards{position:relative;display:flex;gap:16px;width:min(760px,100%)}
#style-chooser .sc-card{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px 12px 16px;text-align:left;font:inherit;color:#f4f1e8;cursor:pointer;border-radius:20px;background:#0c211cd9;border:2px solid #ffffff26;box-shadow:0 18px 50px #00000059;transition:transform .2s ease,border-color .2s ease,background .2s ease}
#style-chooser .sc-card:hover{transform:translateY(-3px);border-color:#e9c46a99;background:#10302a}
#style-chooser .sc-card:focus-visible{outline:3px solid #e9c46a;outline-offset:3px;border-color:#e9c46a}
#style-chooser .sc-card:active{transform:scale(.99)}
#style-chooser .sc-preview{position:relative;display:block;height:150px;border-radius:12px;overflow:hidden}
#style-chooser .sc-preview i{position:absolute;display:block}
#style-chooser .sc-real{background:linear-gradient(180deg,#9db9cf 0%,#cfd8d2 48%,#e6e0cb 62%)}
#style-chooser .sc-real .r1{left:-10%;right:-10%;bottom:0;height:58%;background:linear-gradient(180deg,#6f8a74 0%,#4a6652 55%,#34493b 100%);clip-path:polygon(0 60%,18% 38%,34% 52%,52% 14%,66% 36%,82% 24%,100% 50%,100% 100%,0 100%)}
#style-chooser .sc-real .r2{left:0;right:0;bottom:0;height:30%;background:linear-gradient(180deg,#3d5a45,#24372b);clip-path:polygon(0 40%,30% 20%,55% 38%,80% 16%,100% 34%,100% 100%,0 100%)}
#style-chooser .sc-real .r3{left:38%;bottom:0;width:30%;height:34%;background:linear-gradient(180deg,#b8a98a00,#a89877aa);clip-path:polygon(40% 0,60% 0,100% 100%,0 100%)}
#style-chooser .sc-toon{background:linear-gradient(180deg,#2b2a6b 0%,#c0577a 52%,#f6a56a 72%,#f4d67c 100%)}
#style-chooser .sc-toon .t1{right:16%;top:18%;width:34px;height:34px;border-radius:50%;background:#fff3c4;box-shadow:0 0 0 6px #fff3c433,0 0 26px 8px #fff3c466}
#style-chooser .sc-toon .t2{left:-8%;right:-8%;bottom:0;height:56%;background:#3b3f86;clip-path:polygon(0 55%,16% 34%,34% 50%,54% 12%,70% 38%,86% 22%,100% 46%,100% 100%,0 100%)}
#style-chooser .sc-toon .t3{left:0;right:0;bottom:0;height:32%;background:#23265e;clip-path:polygon(0 38%,28% 18%,52% 36%,78% 14%,100% 32%,100% 100%,0 100%)}
#style-chooser .sc-toon .t4{left:12%;top:14%;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:30px 14px 0 #fff,64px -4px 0 #ffffffcc,110px 20px 0 #fff,150px 4px 0 #ffffffaa}
#style-chooser .sc-name,#style-chooser .sc-desc{display:block}#style-chooser .sc-name{font-size:18px;font-weight:700;padding:0 4px}
#style-chooser .sc-name em{font-style:normal;color:#e9c46a;margin:0 6px}
#style-chooser .sc-desc{margin-top:4px;font-size:14px;line-height:1.5;color:#dfe8d6;padding:0 4px}
#style-chooser .sc-remember{position:relative;display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;color:#dfe8d6;cursor:pointer}
#style-chooser .sc-remember input{width:20px;height:20px;accent-color:#e9c46a;cursor:pointer}
#style-chooser .sc-remember input:focus-visible{outline:3px solid #e9c46a;outline-offset:2px}
#style-chooser .sc-note{position:relative;margin:0;font-size:12px;color:#9fb0a0}
@media (max-width:640px){#style-chooser{justify-content:flex-start;padding-top:max(24px,env(safe-area-inset-top))}#style-chooser .sc-cards{flex-direction:column;gap:12px}#style-chooser .sc-card{flex-direction:row;align-items:center;gap:12px;padding:10px}#style-chooser .sc-preview{flex:0 0 38%;height:96px}#style-chooser .sc-text{flex:1;min-width:0}#style-chooser .sc-name{font-size:16px;padding:0}#style-chooser .sc-desc{font-size:13px;padding:0;margin-top:4px}}
@media (max-height:520px) and (min-width:641px){#style-chooser .sc-preview{height:90px}#style-chooser{gap:10px}}
@media (prefers-reduced-motion:reduce){#style-chooser .sc-card{transition:none}#style-chooser .sc-card:hover{transform:none}}
</style>
</head><body style="margin:0">
<div id="style-chooser" role="dialog" aria-label="그래픽 모드 선택"><div class="sc-head"><p class="sc-brand"><b>산길</b>GWANAK TRAIL</p><h1>어떤 모습으로 걸어 볼까요?</h1><p class="sc-sub">고른 모드에 필요한 자료만 불러옵니다.</p></div><div class="sc-cards"><button type="button" class="sc-card" data-style="realistic" aria-label="실사 모드: 실제 사진 질감과 물리 그림자"><span class="sc-preview sc-real" aria-hidden="true"><i class="r1"></i><i class="r3"></i><i class="r2"></i></span><span class="sc-text"><span class="sc-name">실사<em>—</em>사실적인 산</span><span class="sc-desc">실제 사진 질감·물리 그림자</span></span></button><button type="button" class="sc-card" data-style="toon" aria-label="애니메이션 모드: 만화풍 음영, 노을, 별빛"><span class="sc-preview sc-toon" aria-hidden="true"><i class="t4"></i><i class="t1"></i><i class="t2"></i><i class="t3"></i></span><span class="sc-text"><span class="sc-name">애니메이션<em>—</em>그림 같은 산</span><span class="sc-desc">만화풍 음영·노을·별빛</span></span></button></div><label class="sc-remember"><input type="checkbox" id="style-remember" checked>다음에도 이 모드로 시작</label><p class="sc-note">지도(M)에서 언제든 바꿀 수 있어요.</p></div>
</body></html>
