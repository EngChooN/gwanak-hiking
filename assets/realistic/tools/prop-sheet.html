<!doctype html>
<!-- 상호작용 소품 모델 시트: 위 줄 = 가까이 보는 모델(L0), 아래 줄 = 단순 모델(L1). 개발 서버에서 /assets/realistic/tools/prop-sheet.html -->
<html lang="ko"><head><meta charset="utf-8"><title>상호작용 소품 모델 시트</title>
<style>body{margin:0;background:#cfd6d2;font:14px "Apple SD Gothic Neo",sans-serif}canvas{display:block}.label{position:absolute;transform:translateX(-50%);color:#1d2a24;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:4px;white-space:nowrap;font-size:13px}.row{position:absolute;left:12px;font-weight:bold;color:#1d2a24}</style>
</head><body>
<script type="module">
import * as THREE from 'three';
import {createPropLod,lodStats} from '../interaction-props.js';
const W=innerWidth,H=innerHeight,renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(W,H-40);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcfd6d2);
scene.add(new THREE.HemisphereLight(0xdfe8ff,0x6b5d48,1.4));const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(4,8,6);scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(140,24),new THREE.MeshStandardMaterial({color:0x8d8070,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.x=28;scene.add(ground);
// [종류, 옵션, 보는 크기(m), 회전]
const sign={boards:[{text:'연주대',angle:Math.PI*.75},{text:'호수공원',angle:-Math.PI*.25},{text:'모자봉',angle:Math.PI*.25}]};
const items=[['trailSign',sign,2.6,0,'이정표'],['infoBoard',{title:'관악산 계곡',subtitle:'화강암 계곡 · 평상 · 나무다리'},2.4,0,'해설 안내판'],['summitBoard',{title:'관악산 정상 · 연주대',subtitle:'정상석 629m 표기 · 포털 632m'},1.8,0,'정상 안내판'],['stampBox',{number:4},1.6,0,'스탬프함'],['spring',{},2.2,-.35,'약수터'],['cairnField',{},6,0,'돌탑 공터'],['squirrel',{},.32,-.9,'다람쥐'],['magpie',{},.55,-.9,'까치']];
const views=[];const cols=items.length,stats={};
items.forEach(([kind,opt,size,yaw,name],i)=>{
 const lod=createPropLod(kind,opt);stats[kind]=lodStats(lod);
 [0,1].forEach(level=>{const o=lod.levels[level].object.clone();o.visible=true;o.rotation.y=yaw;const g=new THREE.Group();g.add(o);g.position.set(i*8,0,level*8);scene.add(g);views.push({g,size,i,level,name,kind});});
});
// 칸마다 같은 카메라 각도로 따로 그린다(작은 동물도 칸을 채우게).
const cam=new THREE.PerspectiveCamera(30,1,.01,100);renderer.setScissorTest(true);
const cw=W/cols,ch=(H-40)/2;
for(const v of views){const x=v.i*cw,y=v.level?0:ch;
 const box=new THREE.Box3().setFromObject(v.g),c=box.getCenter(new THREE.Vector3()),d=v.size*2.1;
 cam.aspect=cw/ch;cam.updateProjectionMatrix();cam.position.set(c.x+d*.55,c.y+d*.35,c.z+d);cam.lookAt(c);
 renderer.setViewport(x,y,cw,ch);renderer.setScissor(x,y,cw,ch);renderer.render(scene,cam);
 const s=stats[v.kind][v.level],el=document.createElement('div');el.className='label';el.style.left=`${x+cw/2}px`;el.style.top=`${(v.level?ch:0)+40+ch-26}px`;el.textContent=`${v.name} · ${s.triangles}삼각형 · ${s.drawCalls}dc`;document.body.append(el);}
for(const [t,y] of [['가까이(L0)',44],['단순(L1)',44+ch]]){const el=document.createElement('div');el.className='row';el.style.top=`${y}px`;el.textContent=t;document.body.append(el);}
const head=document.createElement('div');head.className='row';head.style.top='10px';head.textContent='상호작용 소품 모델 시트 · 사진 텍스처 없음 · 치수·색 추정(docs/변경기록-2026-11-04-상호작용-소품.md)';document.body.append(head);
renderer.domElement.style.marginTop='40px';
window.sheet={ready:true,stats};
</script></body></html>
