<!doctype html>
<html lang="ko" data-hud-time="day">
<head>
<meta charset="utf-8">
<title>릴스 오버레이 (1080×1920)</title>
<!-- 색·글꼴 토큰은 등산 수첩 원본을 그대로 불러 쓴다(--paper, --stamp, --ink, --edge, --nb-font …). 새 색·새 글꼴 없음. -->
<link rel="stylesheet" href="../../src/hud-notebook.css">
<style>
/* 사용법: docs/흡연장/릴스-콘티.md 4장. 1080×1920 고정 무대.
   인스타 가림 영역: 위 220 · 아래 420 · 오른쪽 120 → 글자는 x 0~960, y 220~1500 안에만 둔다. */
html,body{margin:0;padding:0;background:transparent}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:var(--nb-font);color:var(--ink);-webkit-font-smoothing:antialiased}
/* 안전 영역 안내선: ?guide=1 */
.guide{display:none;position:absolute;left:0;top:220px;width:960px;height:1280px;outline:4px dashed #f0f;pointer-events:none;z-index:99}
body[data-guide="1"] .guide{display:block}
.stage{position:absolute;inset:0}
.hide{display:none!important}

/* 공통 도장 */
.stamp{display:inline-block;border:6px solid var(--stamp);color:var(--stamp);border-radius:18px;padding:6px 22px;font-weight:900;letter-spacing:-.02em;transform:rotate(-4deg);background:rgba(255,248,238,.9)}
html[data-hud-time=night] .stamp{background:rgba(59,48,36,.92)}

/* ───────── 가. 안내 띠(처음·끝) : 위 안전선 바로 아래 ───────── */
.notice{position:absolute;left:48px;top:240px;width:864px;box-sizing:border-box;padding:18px 24px;text-align:center;
 background:var(--paper);border:6px solid var(--stamp);border-radius:24px;box-shadow:var(--soft);
 color:var(--stamp);font-size:40px;line-height:1.25;font-weight:900;letter-spacing:-.03em}
.notice small{display:block;margin-top:6px;font-size:40px;font-weight:700;color:var(--ink2);letter-spacing:-.02em}

/* ───────── 나. 자막 띠 : 아래 안전선(y1500) 바로 위 ───────── */
.cap{position:absolute;left:48px;width:864px;bottom:440px;box-sizing:border-box;padding:40px 36px 34px;
 background:var(--paper);border:6px solid var(--edge);border-radius:28px;box-shadow:var(--lift),var(--soft);text-align:center}
.cap::before{content:"";position:absolute;inset:10px;border:3px dashed var(--rule);border-radius:20px;pointer-events:none}
.cap .tag{position:absolute;left:28px;top:-34px;transform:rotate(-5deg);font-size:34px;padding:2px 20px;border-width:5px;border-radius:14px}
.cap .txt{position:relative;font-size:68px;line-height:1.28;font-weight:900;letter-spacing:-.04em;color:var(--ink);word-break:keep-all}
.cap .chips{position:relative;display:flex;flex-wrap:nowrap;gap:10px;justify-content:center;margin-top:0}
.cap .chip{flex:1;padding:16px 4px;border:5px solid var(--edge);border-radius:20px;background:var(--paper2);font-size:36px;font-weight:900;color:var(--ink2);white-space:nowrap}
.cap .chip.on{background:var(--stamp);border-color:var(--stamp-d);color:#fff;box-shadow:4px 6px 0 var(--stamp-d)}

/* ───────── 다. 엔딩 카드 ───────── */
/* 작은 줄(안내 줄·접속 주소 라벨·① 소개 줄)은 390px 폭에서 14px 이상 = 1080 무대에서 40px 이상(11-13 점검표). 그만큼 여백을 줄여 카드가 아래 가림 영역(1500~)에 걸리지 않게 함 */
.end{position:absolute;inset:0;background:var(--paper2)}
.end .page{position:absolute;left:48px;top:430px;width:864px;box-sizing:border-box;padding:48px 40px 40px;
 background:var(--paper);border:6px solid var(--edge);border-radius:32px;box-shadow:var(--lift),var(--soft);text-align:center}
.end .page::before{content:"";position:absolute;inset:12px;border:3px dashed var(--rule);border-radius:22px;pointer-events:none}
.end .series{position:relative;font-size:44px;font-weight:900;color:var(--stamp);letter-spacing:-.02em}
.end h1{position:relative;margin:8px 0 0;font-size:120px;line-height:1.05;font-weight:900;letter-spacing:-.06em;color:var(--ink)}
.end .ai{position:relative;margin:26px 0 0;font-size:46px;line-height:1.4;font-weight:800;color:var(--ink);letter-spacing:-.03em;word-break:keep-all}
.end .ai b{color:var(--stamp)}
.end .url{position:relative;margin:28px auto 0;padding:18px 20px;border:5px dashed var(--stamp);border-radius:22px;background:var(--stamp-dash);color:var(--stamp-d);font-size:46px;font-weight:900;letter-spacing:-.02em;word-break:break-all}
.end .url small{display:block;font-size:40px;font-weight:700;margin-bottom:6px;color:var(--ink2)}
html[data-hud-time=night] .end .url{color:var(--paper)}
.end .prev{position:relative;margin:28px 0 0;padding:16px 24px;border:5px solid var(--edge);border-radius:20px;background:var(--paper2);font-size:40px;line-height:1.35;font-weight:800;color:var(--ink2);letter-spacing:-.03em}
.end .prev b{color:var(--ink);font-size:46px}
.end .stampwrap{position:absolute;right:28px;top:-40px}
.end .stampwrap .stamp{font-size:34px;transform:rotate(7deg)}

/* ───────── 라. 표지 ───────── */
.cover{position:absolute;inset:0;background:var(--paper2) center/cover no-repeat}
.cover .card{position:absolute;left:48px;top:560px;width:864px;box-sizing:border-box;padding:56px 40px 52px;text-align:center;
 background:var(--paper);border:6px solid var(--edge);border-radius:32px;box-shadow:var(--lift),var(--soft)}
.cover .card::before{content:"";position:absolute;inset:12px;border:3px dashed var(--rule);border-radius:22px;pointer-events:none}
.cover .series{position:relative;font-size:44px;font-weight:900;color:var(--stamp)}
.cover h1{position:relative;margin:8px 0 0;font-size:140px;line-height:1.05;font-weight:900;letter-spacing:-.06em;color:var(--ink)}
.cover .sub{position:relative;margin:24px 0 0;font-size:50px;font-weight:900;color:var(--ink);letter-spacing:-.03em;word-break:keep-all}
.cover .seal{position:absolute;right:26px;top:-44px;font-size:36px;transform:rotate(7deg)}
</style>
</head>
<body>
<div class="guide"></div>
<div class="stage" id="stage"></div>
<script>
/* 장면 표(콘티와 같은 값). 편집 스크립트가 길이·시간대를 여기서 읽어도 된다: window.reelsOverlay.SCENES */
const SCENES=[
 {n:0,sec:3,  scene:'afterparty',time:'night',tag:'옥상',   cap:'회사 옥상,|잠깐 바람 쐬러 갈래요?',notice:1},
 {n:1,sec:3,  scene:'morning',   time:'day',  tag:'입장',   cap:'몸에 해로운 건|하나도 없어요'},
 {n:2,sec:4,  scene:'morning',   time:'day',  tag:'고르기', cap:'오늘은 어떤 맛?'},
 {n:3,sec:5,  scene:'lunch',     time:'day',  tag:'꿀모금', cap:'꾹 눌러 꿀모금|도넛 링 묘기'},
 {n:4,sec:5,  scene:'lunch',     time:'day',  tag:'수다',   cap:'점심 먹고 온 친구와|인사하고 수다 떨고'},
 {n:5,sec:4,  scene:'evening',   time:'dusk', tag:'쉬기',   cap:'난간에 기대|캔커피 한 잔'},
 {n:6,sec:5,  scene:'morning',   time:'day',  tag:'상황',   cap:'',chips:1},
 {n:7,sec:5,  scene:'afterparty',time:'night',tag:'온라인', cap:'친구랑 같이 피우기|(온라인)'},
 {n:8,sec:3,  scene:'afterparty',time:'night',tag:'금연',   cap:'피울수록 아끼는|담뱃값'},
 {n:9,sec:4.5,scene:'afterparty',time:'night',tag:'',       cap:'',ending:1},
];
const CHIPS=[['morning','☕ 출근 전'],['lunch','🍱 점심'],['evening','🌇 퇴근길'],['afterparty','🍻 회식 후']];
const NOTICE='가상 흡연장 · 진짜 담배 없음 · 금연 응원';
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const br=s=>esc(s).split('|').join('<br>');

function render(o){
 const S=SCENES[+o.scene]||{};
 const mode=o.mode||(S.ending?'ending':'caption');
 const time=o.time||(mode==='caption'?S.time:'day')||'day';
 document.documentElement.dataset.hudTime=time;
 document.body.dataset.guide=o.guide?'1':'';
 const url=o.url||'https://(접속 주소 자리)';
 let h='';
 if(mode==='caption'){
  const text=o.cap??S.cap??'';
  const notice=o.notice!=null?+o.notice:S.notice;
  if(notice)h+=`<div class="notice">${NOTICE}</div>`;
  const body=S.chips&&!o.cap?`<div class="chips">${CHIPS.map(([id,t])=>`<span class="chip${id===o.hl?' on':''}">${t}</span>`).join('')}</div>`:`<div class="txt">${br(text)}</div>`;
  const tag=o.tag??S.tag;
  h+=`<div class="cap">${tag?`<span class="stamp tag">${esc(tag)}</span>`:''}${body}</div>`;
 }else if(mode==='ending'){
  h+=`<div class="end"><div class="notice">${NOTICE}<small>실제 담배 판매·권유 없는 체험 게임이에요</small></div>
  <div class="page"><div class="stampwrap"><span class="stamp">금연 응원</span></div>
   <div class="series">온라인 시리즈 ②</div><h1>온라인<br>흡연장</h1>
   <p class="ai"><b>AI Office</b>의 <b>AI 팀원 5명</b>이<br>기획·디자인·개발·검수까지<br>만든 게임</p>
   <div class="url"><small>접속 주소</small>${esc(url)}</div>
   <div class="prev"><b>① 온라인 등산</b><br>관악산을 같이 걷는 온라인 게임</div></div></div>`;
 }else if(mode==='cover'){
  const bg=o.bg?`style="background-image:url('${esc(o.bg)}')"`:'';
  h+=`<div class="cover" ${bg}><div class="notice">${NOTICE}</div>
  <div class="card"><span class="stamp seal">금연 응원</span>
   <div class="series">온라인 시리즈 ②</div><h1>온라인<br>흡연장</h1>
   <div class="sub">진짜 담배 없는<br>옥상 쉬는 시간</div></div></div>`;
 }
 document.getElementById('stage').innerHTML=h;
 return document.fonts.ready.then(()=>{document.body.dataset.ready='1';return mode;});
}
window.reelsOverlay={SCENES,CHIPS,NOTICE,show:o=>{document.body.dataset.ready='';return render(o);}};
const q=Object.fromEntries(new URLSearchParams(location.search));
render(q);
</script>
</body>
</html>
