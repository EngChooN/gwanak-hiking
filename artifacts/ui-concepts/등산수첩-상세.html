/* ───────── 시안 보드(틀 밖) ───────── */
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",sans-serif;background:#e9e4d6;color:#2a2418;padding:24px 24px 60px}
body.solo{padding:0;background:#000}
.board-h{font-size:22px;margin-bottom:4px}
.board-lead{font-size:13.5px;color:#5b5140;line-height:1.6;margin-bottom:14px}
.ctl{display:flex;flex-wrap:wrap;gap:10px 18px;background:#fffaf0;border-radius:12px;padding:12px 14px;margin-bottom:20px;font-size:13px;position:sticky;top:0;z-index:50;box-shadow:0 2px 10px #0002}
.ctl label{display:flex;align-items:center;gap:6px}
.ctl select{font:inherit;padding:4px 6px;border-radius:6px;border:1px solid #c9b88f;background:#fff}
.frames{display:flex;flex-wrap:wrap;gap:28px;align-items:flex-start}
.frame-wrap h3{font-size:13px;margin-bottom:6px;color:#5b5140;font-weight:700}
body.solo .frame-wrap h3{display:none}

 --stamp:#b0442f;--stamp-d:#5e2216;--accent:#f3a48c;--stamp-dash:#e6b7a4;--go:#9cc27a;--mid:#e5b453;--low:#e0735a;--track:#2a2219;--rule:#5a4a35;
 --soft:0 5px 14px rgba(0,0,0,.5);--hi:inset 0 1px 0 rgba(255,236,200,.12);--scrim:rgba(5,8,16,.45)}
.hud *{position:absolute}
.hud .s,.hud .s *,.hud .tb *{position:static}
.hud button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hud kbd{position:static;font:600 10px/1 ui-monospace,Menlo,monospace;padding:2px 4px;border-radius:4px;border:1px solid var(--rule);color:var(--ink2);background:var(--paper2);opacity:.85;margin-left:4px;vertical-align:1px}
.dev:not(.pc) .hud kbd{display:none}  /* 영어 키 표시는 PC에서만 */

/* ───────── 진행 카드 ───────── */
.card{background:var(--paper);border-radius:9px;box-shadow:var(--lift),var(--soft),var(--hi);transform:rotate(-1.2deg);transform-origin:left top;padding:9px 12px 10px}
.card .s{display:block}
.card .row1{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:11px;color:var(--ink2);font-weight:700}
.card .badge{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);border-radius:4px;padding:1px 5px;font-size:11px;font-weight:800;transform:rotate(-3deg)}
.card .title{font-size:17px;font-weight:800;letter-spacing:-.02em;margin:3px 0 6px;white-space:nowrap}
.card .title em{font-style:normal;color:var(--accent)}
.card .trail{position:relative!important;height:8px;border-radius:4px;background:var(--track);margin:0 10px 9px 0}
.card .trail>*{position:absolute!important}
.card .trail i{left:0;top:0;bottom:0;border-radius:4px;background:var(--go)}
.card .trail u{top:-2px;width:4px;height:12px;border-radius:2px;background:var(--paper);box-shadow:0 0 0 1.5px var(--edge)}
.card .trail u.got{background:var(--stamp);box-shadow:none}
.card .trail b{right:-12px;top:-8px;font-size:15px}
.card .meta{display:flex;gap:10px;font-size:12px;color:var(--ink2);white-space:nowrap}
.card .meta b{color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px}
.card .stam{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11px;font-weight:700;color:var(--ink2)}
.card .stam .bar{position:relative!important;flex:1;height:7px;border-radius:4px;background:var(--track);overflow:hidden}
.card .stam .bar i{position:absolute!important;left:0;top:0;bottom:0;background:var(--go);border-radius:4px}
.card .stam .bar[data-level=mid] i{background:var(--mid)}.card .stam .bar[data-level=low] i{background:var(--low)}
.card .stam b{font-size:12px;color:var(--ink);font-variant-numeric:tabular-nums;min-width:22px;text-align:right}
.card .foot{display:flex;justify-content:space-between;margin-top:6px;padding-top:5px;border-top:1px dashed var(--rule);font-size:11px;color:var(--ink2)}

/* ───────── 책갈피 탭 ───────── */
.rail{display:flex;flex-direction:column;gap:6px}
.rail .tb{position:static;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;width:56px;height:48px;background:var(--tab);border-radius:0 12px 12px 0;box-shadow:var(--lift),var(--hi);font-size:11px;font-weight:800;color:var(--ink)}
.rail .tb em{font-style:normal;font-size:17px;line-height:1}
.rail .tb.on{width:66px;background:var(--paper)}
.dev.pc .rail .tb{flex-direction:row;justify-content:flex-start;gap:8px;width:116px;height:50px;padding-left:14px;font-size:14px}
.dev.pc .rail .tb.on{width:128px}
.dev.pc .rail .tb kbd{margin-left:auto;margin-right:10px}
.tabbar{left:0;right:0;bottom:0;background:var(--tab);border-top:3px dashed var(--edge);display:flex;justify-content:space-around;align-items:flex-start;padding-top:5px;box-shadow:0 -4px 12px rgba(40,25,5,.2)}
.tabbar .tb{position:static;display:flex;flex-direction:column;align-items:center;gap:2px;width:72px;height:50px;justify-content:center;border-radius:10px;font-size:12px;font-weight:800}
.tabbar .tb em{font-style:normal;font-size:20px;line-height:1}
.tabbar .tb.on{background:var(--paper);box-shadow:var(--lift)}

/* ───────── 꼬리표 ───────── */
.tag{display:flex;align-items:center;gap:6px;background:var(--paper2);border-radius:6px;padding:0 12px 0 18px;height:34px;box-shadow:var(--lift),var(--soft),var(--hi);font-weight:800;font-size:13px;white-space:nowrap}
.tag::before{content:"";position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--pin);box-shadow:inset 0 1px 1px #0004}
.tag small{font-size:11px;font-weight:600;color:var(--ink2);position:static}
.tag.btn{height:44px}
.dev.pc .tag{height:44px;font-size:14px}
/* 상황 꼬리표(알약 대신) */
.ctx{background:var(--paper);border-radius:8px;box-shadow:var(--lift),var(--soft),var(--hi);padding:8px 10px 8px 20px;min-width:200px;max-width:280px}
.ctx::before{content:"";position:absolute;left:7px;top:15px;width:6px;height:6px;border-radius:50%;background:var(--pin)}
.ctx .s{display:block}
.ctx .head{font-size:14px;font-weight:800;line-height:1.3}
.ctx .sub{font-size:12px;color:var(--ink2);line-height:1.35;margin-top:1px}
.ctx .alt{display:flex!important;align-items:center;gap:8px;width:100%;min-height:44px;margin-top:6px;border-top:1px dashed var(--rule);padding-top:4px;text-align:left;font-size:13px;font-weight:800}
.ctx .alt em{font-style:normal;display:grid!important;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--paper2);box-shadow:1px 2px 0 var(--edge);font-size:13px}
.ctx .alt small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.ctx .lock{color:var(--accent);font-weight:800}
.dev.pc .ctx{max-width:320px}.dev.pc .ctx .head{font-size:15px}

/* ───────── 도장 · 칩 ───────── */
.stamp{display:grid;place-items:center;text-align:center;border-radius:50%;background:var(--stamp);color:var(--stamp-ink);border:3px dashed var(--stamp-dash);
 box-shadow:0 4px 0 var(--stamp-d),0 8px 16px rgba(60,15,5,.35);transform:rotate(-8deg);font-weight:900;line-height:1.15;font-size:14px}
.stamp .s{display:block}
.stamp .ic{font-size:22px;line-height:1}
.stamp small{display:block;font-size:10px;font-weight:700;opacity:.9;margin-top:1px}
.stamp.walking{box-shadow:0 0 0 5px var(--paper),0 0 0 8px var(--go),0 4px 0 8px var(--stamp-d),0 10px 18px rgba(60,15,5,.35)}
.stamp.done{background:var(--paper);color:var(--accent);border-color:var(--accent)}
.stamp.lock{background:#9b8a72;border-color:#e6dccb;box-shadow:0 4px 0 #5e5141,0 8px 16px rgba(0,0,0,.3)}
.hud[data-time=night] .stamp.lock{background:#5d5144;border-color:#a99880;box-shadow:0 4px 0 #2c241b}
.stamp.busy{background:conic-gradient(var(--stamp) 0 62%,var(--stamp-d) 62% 100%)}
.chip{display:grid;place-items:center;text-align:center;border-radius:50%;background:var(--paper);box-shadow:var(--lift),var(--soft),var(--hi);font-size:11px;font-weight:800;line-height:1.1}
.chip .s{display:block}
.chip em{font-style:normal;font-size:18px;line-height:1;display:block}
.dev.pc .chip kbd{display:block;margin:2px auto 0;width:max-content}
.chip.on{background:var(--stamp);color:#fff;box-shadow:0 3px 0 var(--stamp-d),var(--soft)}
.chip.on kbd{color:#fff;border-color:#fff8;background:transparent}
/* 떠다니는 조이스틱 */
.joy{border-radius:50%;border:2px dashed rgba(255,255,255,.75);background:rgba(255,255,255,.08)}
.joy::after{content:"";position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:rgba(255,255,255,.55)}
.joy-t{font-size:11px;color:#fff;text-shadow:0 1px 3px #000c;white-space:nowrap;font-weight:700}
.credit{font-size:10px;color:#fffd;background:rgba(20,16,10,.45);border-radius:6px;padding:2px 7px;white-space:nowrap}

/* ───────── 탭 시트 ───────── */
.sheet{background:var(--paper);box-shadow:var(--lift),0 10px 30px rgba(30,20,5,.35),var(--hi);border-radius:4px 14px 14px 4px;padding:14px 16px;overflow:hidden}
.sheet .s{display:block}
.sheet h4{font-size:16px;font-weight:900;display:flex!important;justify-content:space-between;align-items:center;margin-bottom:4px}
.sheet .note{font-size:12px;color:var(--ink2);margin-bottom:10px}
.sheet .grid{display:grid!important;grid-template-columns:repeat(var(--cols,2),1fr);gap:8px}
.it{display:flex!important;align-items:center;gap:9px;min-height:52px;padding:6px 10px;border-radius:10px;background:var(--paper2);box-shadow:1px 2px 0 var(--edge);text-align:left;font-size:13.5px;font-weight:800}
.it em{font-style:normal;font-size:19px;width:26px;text-align:center}
.it small{display:block;font-size:11px;font-weight:600;color:var(--ink2)}
.dev.land .it{min-height:48px;padding:4px 10px}
.it.on{outline:2px solid var(--stamp);outline-offset:-2px}
.it.off{opacity:.55}
.it.dev-only{border:1.5px dashed var(--stamp);box-shadow:none}
.seg{display:flex!important;gap:4px;margin-top:2px}
.seg span{flex:1;min-height:44px;display:grid!important;place-items:center;border-radius:8px;background:var(--paper2);font-size:13px;font-weight:800;box-shadow:1px 2px 0 var(--edge)}
.seg span.on{background:var(--stamp);color:#fff;box-shadow:0 2px 0 var(--stamp-d)}
.lbl{font-size:12px;font-weight:800;color:var(--ink2);margin:10px 0 4px}
.close{display:grid!important;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--paper2);box-shadow:1px 2px 0 var(--edge);font-size:16px;font-weight:900}

/* ───────── 대화창(수첩 종이) ───────── */
.scrim{inset:0;background:var(--scrim)}
.dlg{background:var(--paper);border-radius:6px 6px 14px 14px;box-shadow:var(--lift),0 18px 40px rgba(20,12,2,.45),var(--hi);padding:26px 22px 18px;overflow:hidden}
.dlg .s{display:block}
.dlg::before{content:"";position:absolute;left:18px;right:18px;top:8px;height:10px;background:radial-gradient(circle at 7px 5px,var(--edge) 0 3.2px,transparent 3.6px) 0 0/22px 10px repeat-x;opacity:.85}
.dlg .hd{display:flex!important;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.dlg h2{font-size:19px;font-weight:900;letter-spacing:-.02em}
.dlg h2 small{display:block;font-size:12px;font-weight:600;color:var(--ink2);margin-top:2px}
.dlg p{font-size:13.5px;line-height:1.55;color:var(--ink2)}
.dlg .btn-stamp{display:inline-flex!important;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border-radius:10px;background:var(--stamp);color:#fff;font-weight:900;font-size:15px;border:2px dashed var(--stamp-dash);box-shadow:0 3px 0 var(--stamp-d)}
.dlg .btn-paper{display:inline-flex!important;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:9px;background:var(--paper2);font-weight:800;font-size:13.5px;box-shadow:1px 2px 0 var(--edge)}
.keys{display:grid!important;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px;margin-top:8px}
.keys dt{font-weight:800;white-space:nowrap}.keys dd{color:var(--ink2)}
.keys dt kbd{margin:0 2px 0 0}
.slots{display:grid!important;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.slot{min-height:92px;border:1.5px dashed var(--rule);border-radius:10px;display:grid!important;place-items:center;text-align:center;font-size:12px;color:var(--ink2);padding:6px}
.slot b{display:block;color:var(--ink);font-size:13px}
.slot .seal{display:grid!important;place-items:center;width:52px;height:52px;margin:0 auto 4px;border-radius:50%;border:3px double var(--accent);color:var(--accent);font-weight:900;font-size:12px;transform:rotate(-12deg)}
.slot.next{border-color:var(--stamp);border-style:dashed}
.prog{position:relative!important;height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.prog i{position:absolute!important;left:0;top:0;bottom:0;background:var(--go)}
.mapbox{position:relative!important;border-radius:10px;background:var(--paper2);box-shadow:inset 0 0 0 1.5px var(--rule)}
.mapbox svg{display:block;width:100%;height:100%}
.cps{display:flex!important;flex-wrap:wrap;gap:6px;margin-top:8px}
.cps span{font-size:12px;font-weight:700;padding:4px 8px;border-radius:5px;background:var(--paper2);box-shadow:1px 2px 0 var(--edge)}
.cps span.got{background:var(--stamp);color:#fff;box-shadow:0 2px 0 var(--stamp-d)}
/* 로딩 */
.loading{inset:0;background:linear-gradient(180deg,#0d2a25,#173f36 45%,#2d5a45)}
.loading svg{left:0;bottom:0;width:100%;height:62%}
/* 쌍안경 */
.bino{inset:0;background:radial-gradient(ellipse 34% 52% at 36% 50%,transparent 96%,#000 100%),radial-gradient(ellipse 34% 52% at 64% 50%,transparent 96%,#000 100%);}
.binomask{inset:0;-webkit-mask:radial-gradient(ellipse 34% 52% at 36% 50%,#000 96%,transparent 100%),radial-gradient(ellipse 34% 52% at 64% 50%,#000 96%,transparent 100%);background:transparent}
.tape{left:50%;transform:translateX(-50%);display:flex;gap:0;background:var(--paper2);border-radius:4px;box-shadow:var(--lift);height:30px;align-items:center;padding:0 10px;font:700 12px/1 ui-monospace,Menlo,monospace;color:var(--ink2);white-space:nowrap}
.tape .s{padding:0 9px}.tape b{color:var(--accent)}
.lm{display:flex;flex-direction:column;align-items:center}
.lm .tag{position:relative}
.lm i{position:static;width:2px;height:40px;background:var(--paper2);box-shadow:1px 0 0 var(--edge)}
.lm i+i{width:8px;height:8px;border-radius:50%;background:var(--stamp)}
/* 휴대폰 */
.phone{border-radius:34px;background:#111;box-shadow:0 0 0 3px #3a3a3a,0 20px 40px #0008;overflow:hidden}
.phone .vf{inset:10px;border-radius:26px;background:center/cover no-repeat}
/* 인사 메뉴 · 이름표 */
.wheel-c{background:var(--paper);border-radius:50%;display:grid;place-items:center;text-align:center;font-size:12px;font-weight:900;box-shadow:var(--lift),var(--soft)}
.nametag{background:var(--paper2);border-radius:5px;padding:4px 9px 4px 16px;font-size:12px;font-weight:800;box-shadow:var(--lift),var(--soft);white-space:nowrap}
.nametag::before{content:"";position:absolute;left:5px;top:50%;width:5px;height:5px;margin-top:-2.5px;border-radius:50%;background:var(--pin)}
.nametag::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--paper2)}
.hiker{width:22px;height:46px;border-radius:11px 11px 4px 4px;background:linear-gradient(#e8a24a 0 30%,#3d6a8a 30% 75%,#333 75%)}
.toast{background:var(--paper2);}
</style></head>
<body>
<h1 class="board-h">등산 수첩 UI — 실제 크기 상세 시안</h1>
<p class="board-lead">인터페이스 시안5의 ③을 실제 픽셀 크기로 키웠습니다. 휴대폰 가로 844×390 · 세로 390×844 (아이폰 14 기준 안전 영역 · 빗금) · PC 1440×900. 배경은 실제 카툰 화면(같은 자리 낮·노을·밤)입니다. 사양: <code>docs/UI-등산수첩-사양.md</code></p>
<div class="ctl" id="ctl">
 <label>기기 <select id="c-dev"><option value="all">셋 다</option><option value="land">휴대폰 가로</option><option value="port">휴대폰 세로</option><option value="pc">PC</option></select></label>
 <label>시간 <select id="c-time"><option value="day">낮</option><option value="dusk">노을</option><option value="night">밤</option></select></label>
 <label>상황 <select id="c-state">
  <option value="idle">평소 (서 있음)</option><option value="auto">자동 걷기 중</option><option value="sign">안내판 앞</option><option value="stamp">스탬프함 앞</option>
  <option value="cairn">돌탑 공터 (할 일 여럿)</option><option value="spring-lock">약수 · 다시 기다림</option><option value="busy">약수 마시는 중</option>
  <option value="sit">앉아 있음</option><option value="greet">함께 걷기 · 옆 사람</option><option value="hidden">화면 숨김</option></select></label>
 <label>펼침 <select id="c-panel">
  <option value="none">없음</option><option value="tab-backpack">배낭 탭</option><option value="tab-rest">쉬기 탭</option><option value="tab-settings">설정 탭</option>
  <option value="dlg-help">도움말</option><option value="dlg-map">지도</option><option value="dlg-book">수첩</option><option value="dlg-summit">정상 도착</option>
  <option value="tool-bino">쌍안경</option><option value="tool-phone">휴대폰</option><option value="wheel">인사 메뉴</option><option value="loading">로딩 화면</option></select></label>
 <label><input type="checkbox" id="c-safe" checked> 안전 영역</label>
 <label><input type="checkbox" id="c-hit"> 터치 영역</label>
</div>

<script>
const Q=new URLSearchParams(location.search);
const DEVS={land:{w:844,h:390,name:'휴대폰 가로 844×390'},port:{w:390,h:844,name:'휴대폰 세로 390×844'},pc:{w:1440,h:900,name:'PC 1440×900'}};
const SAFE={land:{l:47,r:47,t:0,b:21},port:{l:0,r:0,t:47,b:34},pc:{l:0,r:0,t:0,b:0}};
// 도장·칩 치수(px)와 칩 각도(도, 오른쪽 0°·위 90°)
const GEO={land:{stamp:78,chip:52,R:100,angles:[180,146,112,78],m:14},
           port:{stamp:84,chip:54,R:102,angles:[180,135,90],m:16},
           pc:{stamp:96,chip:60,R:112,angles:[180,145,110,75],m:32}};
const TAB_H=58;
const ENV={day:{short:'☀ 14:20',long:'☀ 14:20 <small>맑음</small>'},dusk:{short:'☀ 17:40',long:'☀ 17:40 <small>노을</small>'},night:{short:'☾ 21:40',long:'☾ 21:40 <small>맑음</small>'}};
const TABS=[['map','🗺','지도','M'],['book','📒','수첩','J'],['backpack','🎒','배낭',''],['rest','🪑','쉬기',''],['settings','⚙','설정','']];
const esc=s=>String(s);
const k=key=>key?`<kbd>${key}</kbd>`:'';

// 도장 상태 표 — 사양 3절과 같은 값
function stampModel(state){
 switch(state){
  case 'auto':return {cls:'walking',ic:'✋',label:'멈추기',sub:'자동 걷기 중',key:'R'};
  case 'sign':return {ic:'🪧',label:'읽기',sub:'안내판',key:'F',ctx:{head:'관악산 안내도',sub:'안내판 · 지명과 코스 안내'}};
  case 'stamp':return {ic:'㊞',label:'찍기',sub:'스탬프 3',key:'F',ctx:{head:'스탬프 찍기 · 깔딱고개',sub:'숨이 턱에 차는 오르막 끝'}};
  case 'cairn':return {ic:'㊞',label:'찍기',sub:'스탬프 4',key:'F',ctx:{head:'스탬프 찍기 · 돌탑 공터',sub:'돌을 하나씩 올려 쌓은 탑',alt:[{key:'2',ic:'🪨',label:'돌 올리기',sub:'실제 산에서는 돌을 옮기지 마세요'}]}};
  case 'spring-lock':return {cls:'lock',ic:'⏳',label:'18초',sub:'약수',key:'F',ctx:{head:'약수 한 모금',sub:'',lock:'18초 뒤에 다시 할 수 있어요'}};
  case 'busy':return {cls:'busy',ic:'💧',label:'마시는 중',sub:'움직이면 멈춰요',key:''};

  hud.insertAdjacentHTML('beforeend',`<div class="chip hit ${i===0?'on':''}" style="left:${x-c/2}px;top:${y-c/2}px;width:${c}px;height:${c}px"><span class="s"><em>${ic}</em>${n}${k(key)}</span></div>`);});
}
function binoHTML(hud,dev,S,time){
 const W=DEVS[dev].w,H=DEVS[dev].h,port=dev==='port',pc=dev==='pc';
 hud.insertAdjacentHTML('beforeend',`<div class="s" style="position:absolute;inset:0;background:radial-gradient(${port?'ellipse 46% 30%':'ellipse 30% 46%'} at ${port?'50% 40%':'38% 50%'},transparent 97%,#000 99%),radial-gradient(${port?'ellipse 46% 30%':'ellipse 30% 46%'} at ${port?'50% 60%':'62% 50%'},transparent 97%,#000 99%);"></div>`);
 // 겹쳐서 가운데를 투명하게: 두 원 바깥만 검게(간단 근사)
 hud.lastElementChild.style.background=`radial-gradient(${port?'circle 190px':'ellipse 46% 64%'} at 50% 50%,transparent 70%,rgba(0,0,0,.92) 100%)`;
 const top=S.t+12;
 hud.insertAdjacentHTML('beforeend',`<div class="tape" style="top:${top}px">${['NE 40','50','<b>▼ 60</b>','70','80 E'].map(t=>`<span class="s">${t}</span>`).join('')}</div>`);
 hud.insertAdjacentHTML('beforeend',`<div class="lm" style="left:${W*.42}px;top:${H*.33}px;transform:translateX(-50%)"><span class="tag">롯데월드타워 <small>· 14.2 km</small></span><i></i><i></i></div>`);
 hud.insertAdjacentHTML('beforeend',`<div class="lm" style="left:${W*.66}px;top:${H*.38}px;transform:translateX(-50%) scale(.9)"><span class="tag">남산서울타워 <small>· 11.8 km</small></span><i style="height:28px"></i><i></i></div>`);
 const b=S.b+(pc?28:14),r=S.r+(pc?28:14);
 hud.insertAdjacentHTML('beforeend',`<div class="tag" style="left:50%;transform:translateX(-50%);bottom:${b+(port?62:0)}px">🔭 8× <small>· ${pc?'휠로 배율':'두 손가락으로 배율'}</small></div>`);
 const st=pc?96:78;
 hud.insertAdjacentHTML('beforeend',`<div class="stamp hit" style="right:${r}px;bottom:${b+(port?54:0)}px;width:${st}px;height:${st}px"><span class="s"><span class="s ic">🔎</span>자세히<small>롯데월드타워</small><kbd>F</kbd></span></div>`);
 hud.insertAdjacentHTML('beforeend',`<div class="chip hit" style="left:${S.l+(pc?28:14)}px;bottom:${b}px;width:52px;height:52px"><span class="s"><em>✕</em>닫기<kbd>B</kbd></span></div>`);
 hud.insertAdjacentHTML('beforeend',`<div class="chip hit on" style="left:${S.l+(pc?28:14)+62}px;bottom:${b}px;width:52px;height:52px"><span class="s"><em>🏷</em>이름표<kbd>N</kbd></span></div>`);
}
function phoneHTML(hud,dev,S,time){
 const W=DEVS[dev].w,H=DEVS[dev].h,port=dev==='port',pc=dev==='pc';
 hud.insertAdjacentHTML('beforeend','<div class="scrim" style="background:rgba(0,0,0,.25)"></div>');
 const pw=port?300:pc?560:470,ph=port?430:pc?330:262,pl=(W-pw)/2-(port?0:40),pt=port?S.t+20:(H-S.b-ph)/2;
 hud.insertAdjacentHTML('beforeend',`<div class="phone" style="left:${pl}px;top:${pt}px;width:${pw}px;height:${ph}px"><div class="vf" style="background-image:var(--bg-${time})"></div><div class="s" style="position:absolute;top:18px;left:50%;transform:translateX(-50%);font:700 12px/1 -apple-system;color:#fff;background:#0007;border-radius:10px;padding:4px 8px">2.0×</div></div>`);
 // 휴대폰 옆 도구: 종이 칩 + 빨간 셔터 도장
 const colX=port?null:pl+pw+18, col=(i)=>port?{left:`${30+i*84}px`,top:`${pt+ph+14}px`}:{left:`${colX}px`,top:`${pt+i*62}px`};
 ['0.5×','1×','2×','5×'].forEach((z,i)=>{const p=col(i);hud.insertAdjacentHTML('beforeend',`<div class="chip hit ${z==='2×'?'on':''}" style="left:${p.left};top:${p.top};width:52px;height:52px;font-size:13px"><span class="s">${z}</span></div>`);});
 const sx=port?W/2-39:colX+70,sy=port?pt+ph+76:pt+ph/2-39;
 hud.insertAdjacentHTML('beforeend',`<div class="stamp hit" style="left:${sx}px;top:${sy}px;width:78px;height:78px"><span class="s"><span class="s ic">◉</span>찍기<kbd>Space</kbd></span></div>`);
 const tools=[['⟲','셀카','Y'],['▦','격자',''],['▭','가로',''],['✕','닫기','P']];
 tools.forEach(([ic,n,key],i)=>{const x=port?30+i*84:S.l+16,y=port?pt+ph+164:pt+i*62;
  hud.insertAdjacentHTML('beforeend',`<div class="chip hit" style="left:${x}px;top:${y}px;width:52px;height:52px"><span class="s"><em>${ic}</em>${n}${k(key)}</span></div>`);});
}

 hud.insertAdjacentHTML('beforeend',`<div class="loading"><svg viewBox="0 0 1200 520" preserveAspectRatio="xMidYMax slice"><path fill="#3d6b52" opacity=".55" d="M0 330 L120 290 L230 315 L340 250 L450 280 L560 215 L640 245 L720 190 L790 150 L850 175 L930 215 L1030 185 L1120 240 L1200 215 L1200 520 L0 520Z"/><path fill="#2a5242" opacity=".8" d="M0 380 L90 350 L200 372 L320 320 L420 345 L520 300 L610 330 L700 285 L760 262 L800 244 L840 258 L900 300 L1000 280 L1100 325 L1200 305 L1200 520 L0 520Z"/><path fill="#173f36" d="M0 440 C100 415 180 430 280 405 C380 380 450 405 560 385 C680 362 760 392 880 372 C980 356 1080 385 1200 365 L1200 520 L0 520Z"/></svg></div>`);

 box.innerHTML=`<p class="s" style="font-size:12px;letter-spacing:2px;color:var(--ink2)"><b class="s" style="display:inline;font-size:19px;color:var(--ink);letter-spacing:2px">산길</b> &nbsp;GWANAK TRAIL</p>
 <h2 class="s" style="margin:2px 0 12px">관악산 서울대 계곡 코스</h2>
 <div class="s" style="display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px"><span class="s">도심 불빛을 켜는 중</span><span class="s" style="color:#f0a08a">64%</span></div>
 <div class="s prog" style="height:10px"><i style="width:64%;background:linear-gradient(90deg,var(--go),var(--mid))"></i></div>
 <div class="s" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:10px">${steps.map(([n,s])=>`<span class="s" style="font-size:12px;font-weight:800;padding:4px 9px;border-radius:5px;background:${s==='done'?'var(--go)':'var(--paper2)'};color:${s==='done'?'#1d2a12':s==='active'?'var(--ink)':'var(--ink2)'};${s==='active'?'outline:1.5px dashed var(--mid)':''};box-shadow:1px 2px 0 var(--edge)">${s==='done'?'✓ ':''}${n}</span>`).join('')}</div>
 <p class="s" style="margin-top:12px;padding-top:10px;border-top:1px dashed var(--rule);font-size:13px"><b class="s" style="display:inline;color:var(--mid)">산행 안내 · </b>깔딱고개 앞에서는 앉아서 차 한 잔 쉬어 가세요.</p>
 <div class="s" style="text-align:right;margin-top:12px"><button class="s btn-stamp hit" style="opacity:.5">출발하기</button></div>`;
 hud.append(box);
}
// ── 보드 그리기 ──
function draw(){
 const dev=Q.get('dev')||document.getElementById('c-dev').value,time=Q.get('time')||document.getElementById('c-time').value,
  state=Q.get('state')||document.getElementById('c-state').value,panel=Q.get('panel')||document.getElementById('c-panel').value;
 const f=document.getElementById('frames');f.innerHTML='';
 (dev==='all'?['land','port','pc']:[dev]).forEach(d=>f.append(render(d,time,state,panel)));
}
if(Q.get('solo')){document.body.classList.add('solo');document.getElementById('ctl').remove();document.querySelectorAll('.board-h,.board-lead').forEach(e=>e.remove());}
if(Q.get('safe')==='0'||(Q.get('solo')&&Q.get('safe')!=='1'))document.body.classList.remove('show-safe');else document.body.classList.add('show-safe');
if(Q.get('hit')==='1')document.body.classList.add('show-hit');
const bind=(id,fn)=>{const e=document.getElementById(id);if(e)e.addEventListener('change',fn);};
['c-dev','c-time','c-state','c-panel'].forEach(id=>bind(id,draw));
bind('c-safe',e=>document.body.classList.toggle('show-safe',e.target.checked));
bind('c-hit',e=>document.body.classList.toggle('show-hit',e.target.checked));
draw();
</script>
