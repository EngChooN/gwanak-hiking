<!doctype html><html lang="ko"><meta charset="utf-8"><style>body{margin:0;background:#d5e2eb}#label{position:absolute;top:24px;left:30px;font:24px sans-serif;color:#21382e}</style><div id="label">등산객 동작 검수</div><script type="module">
import * as THREE from '/node_modules/three/build/three.module.js';
import {loadRealisticHiker} from '/src/realistic-hiker.js';
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.setClearColor(0xd5e2eb);document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);camera.position.set(2.4,1.8,-3.5);camera.lookAt(0,.75,0);
scene.add(new THREE.HemisphereLight(0xffffff,0x6b7155,2));const light=new THREE.DirectionalLight(0xffedcf,3);light.position.set(-3,5,-4);light.castShadow=true;scene.add(light);
const plane=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x777c60,roughness:1}));plane.rotation.x=-Math.PI/2;plane.receiveShadow=true;scene.add(plane);
const h=await loadRealisticHiker('/assets/realistic/models/hiker/Hiker.glb');scene.add(h.scene);window.hiker=h;let spec={pose:'stand',running:false,slope:0},phase=0,elapsed=0,last=performance.now(),teaStart=0,frames=0,start=last;
window.setSpec=s=>{spec=s;elapsed=phase=0;start=performance.now();frames=0;plane.rotation.set(-Math.PI/2,-Math.atan(s.slope??0),0);document.querySelector('#label').textContent=s.label;h.setPose('stand');};
function tick(now){requestAnimationFrame(tick);const dt=Math.min(.05,(now-last)/1000);last=now;elapsed+=dt;phase+=dt*(spec.running?2.7:1.7);const surfaceHeight=(x,z)=>(spec.slope??0)*x;
 h.update({pose:spec.pose==='tea'&&elapsed<1?'sit':spec.pose,clip:spec.pose==='stand'?'Walk':'Idle',stepPhase:phase,stepLength:.7,idleSeconds:now/1000,dt,running:spec.running,teaProgress:spec.pose==='tea'?Math.min(.5,Math.max(0,(elapsed-1)/3)):undefined});h.ground({moving:spec.pose==='stand',surfaceHeight});renderer.render(scene,camera);frames++;window.result={fps:frames/((now-start)/1000),interaction:h.interaction,eyeHeight:h.eyeHeight};}
requestAnimationFrame(tick);window.ready=true;
</script></html>
